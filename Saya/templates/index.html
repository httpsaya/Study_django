<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Video Comments Room</title>
    <style>
        #chat-log { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .comment { margin-bottom: 5px; }
        .username { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <h2>Комментарии к видео #<span id="video-id-display"></span></h2>

    <div id="chat-log">
        </div>

    <input id="username-input" type="text" placeholder="Ваше имя..."><br><br>
    <input id="chat-message-input" type="text" placeholder="Напишите комментарий..." size="50">
    <button id="chat-message-submit">Отправить</button>

    <script>
        // В реальном Django проекте ID видео можно передать через контекст шаблона {{ video.id }}
        const videoId = "1"; // Замени на динамический ID
        document.getElementById('video-id-display').innerText = videoId;

        // Создаем WebSocket соединение
        // Используем window.location.host, чтобы работало и на 127.0.0.1, и на сервере
        const chatSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/video/' + videoId + '/'
        );

        // 1. ПОЛУЧЕНИЕ СООБЩЕНИЯ
        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const chatLog = document.querySelector('#chat-log');
            
            // Создаем новый элемент для комментария
            const commentElement = document.createElement('div');
            commentElement.className = 'comment';
            commentElement.innerHTML = `<span class="username">${data.username}:</span> ${data.message}`;
            
            chatLog.appendChild(commentElement);
            chatLog.scrollTop = chatLog.scrollHeight; // Авто-скролл вниз
        };

        chatSocket.onclose = function(e) {
            console.error('Сокет неожиданно закрылся');
        };

        // 2. ОТПРАВКА СООБЩЕНИЯ
        document.querySelector('#chat-message-submit').onclick = function(e) {
            const messageInputDom = document.querySelector('#chat-message-input');
            const usernameInputDom = document.querySelector('#username-input');
            const message = messageInputDom.value;
            const username = usernameInputDom.value || 'Аноним';

            if (message) {
                chatSocket.send(JSON.stringify({
                    'message': message,
                    'username': username
                }));
                messageInputDom.value = ''; // Очищаем поле ввода
            }
        };

        // Отправка по нажатию Enter
        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.keyCode === 13) { 
                document.querySelector('#chat-message-submit').click();
            }
        };
    </script>
</body>
</html>
